# Conda environment of the course: conda env create -f environment.yml
name: ai-cardiology
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn
  - scikit-learn
  - scikit-image
  - ipywidgets
  - jupyterlab
  - notebook
  - pip
  - pip:
      - wfdb
      - neurokit2
      - torch
      - torchvision
      - transformers
      - streamlit
