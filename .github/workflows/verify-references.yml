name: Verify references

on:
  schedule:
    - cron: "17 6 1 * *"
  push:
    paths:
      - "references/**"
      - "tools/verify_references.py"
      - ".github/workflows/verify-references.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compare every reference with Crossref, DataCite and OpenAlex
        run: python tools/verify_references.py references/references.json
